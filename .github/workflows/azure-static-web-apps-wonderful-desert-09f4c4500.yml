name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Dev

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Publish Blazor WASM
      - name: Publish Blazor WASM
        run: dotnet publish RuisuAndDar/RuisuAndDar/RuisuAndDar.csproj -c Release -o publish

      # Deploy to Azure Static Web Apps
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_DESERT_09F4C4500 }}

          action: "upload"

          # We already built the app ourselves
          skip_app_build: true

          # Deploy published static files
          app_location: "publish/wwwroot"

          api_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_DESERT_09F4C4500 }}
          action: "close"
